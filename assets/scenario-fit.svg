<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="1" stop-color="#151a26"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b8cff"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#0d1117"/>
  <text x="480" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#e8edf5">一次运行，两个答案：哪个框架适合你的场景 · 配置还能怎么优化</text>
  <text x="480" y="68" text-anchor="middle" font-size="12.5" fill="#7d8699">同一批任务 · 同一评审 · 基线 vs 优化后的对照实验</text>

  <!-- stage 1 -->
  <g>
    <rect x="24" y="100" width="168" height="120" rx="12" fill="url(#card)" stroke="#2c3547"/>
    <text x="108" y="128" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e8edf5">开源 Agent 框架</text>
    <text x="108" y="152" text-anchor="middle" font-size="11.5" fill="#9fb0cc">OpenCode · Codex</text>
    <text x="108" y="170" text-anchor="middle" font-size="11.5" fill="#9fb0cc">DSH · 你的框架</text>
    <text x="108" y="198" text-anchor="middle" font-size="10.5" fill="#5f6b85">substrate 注册表统一接入</text>
  </g>
  <line x1="196" y1="160" x2="226" y2="160" stroke="#5b8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 2 -->
  <g>
    <rect x="230" y="100" width="168" height="120" rx="12" fill="url(#card)" stroke="#2c3547"/>
    <text x="314" y="128" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e8edf5">场景任务集</text>
    <text x="314" y="152" text-anchor="middle" font-size="11.5" fill="#9fb0cc">JobBench · LAB</text>
    <text x="314" y="170" text-anchor="middle" font-size="11.5" fill="#9fb0cc">WorkBuddy · 自定义</text>
    <text x="314" y="198" text-anchor="middle" font-size="10.5" fill="#5f6b85">bench 适配器可插拔</text>
  </g>
  <line x1="402" y1="160" x2="432" y2="160" stroke="#5b8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 3 -->
  <g>
    <rect x="436" y="100" width="168" height="120" rx="12" fill="url(#card)" stroke="#5b8cff" stroke-opacity="0.55"/>
    <text x="520" y="128" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e8edf5">PPC 优化环</text>
    <text x="520" y="152" text-anchor="middle" font-size="11.5" fill="#9fb0cc">Propose → Probe</text>
    <text x="520" y="170" text-anchor="middle" font-size="11.5" fill="#9fb0cc">→ Compose</text>
    <text x="520" y="198" text-anchor="middle" font-size="10.5" fill="#5f6b85">同任务对照 · 无分数参与</text>
  </g>
  <line x1="608" y1="160" x2="638" y2="160" stroke="#5b8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 4 -->
  <g>
    <rect x="642" y="100" width="148" height="120" rx="12" fill="url(#card)" stroke="#2c3547"/>
    <text x="716" y="128" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e8edf5">盲选 + 评审</text>
    <text x="716" y="152" text-anchor="middle" font-size="11.5" fill="#9fb0cc">匿名 A/B 选交付物</text>
    <text x="716" y="170" text-anchor="middle" font-size="11.5" fill="#9fb0cc">选完才打分</text>
    <text x="716" y="198" text-anchor="middle" font-size="10.5" fill="#5f6b85">rubric 逐条判定</text>
  </g>
  <line x1="794" y1="160" x2="824" y2="160" stroke="#5b8cff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- stage 5 -->
  <g>
    <rect x="828" y="100" width="132" height="120" rx="12" fill="url(#card)" stroke="#3ecf72" stroke-opacity="0.5"/>
    <text x="894" y="128" text-anchor="middle" font-size="14.5" font-weight="650" fill="#e8edf5">匹配度报告</text>
    <text x="894" y="152" text-anchor="middle" font-size="11.5" fill="#9fb0cc">逐域增益图</text>
    <text x="894" y="170" text-anchor="middle" font-size="11.5" fill="#9fb0cc">优化建议</text>
    <text x="894" y="198" text-anchor="middle" font-size="10.5" fill="#5f6b85">harness2-view</text>
  </g>

  <text x="480" y="262" text-anchor="middle" font-size="12" fill="#5f6b85">harness = 模型周围的可编辑配置（提示词 · 规则 · 记忆 · 技能 · 脚本），模型本身不动</text>
</svg>
