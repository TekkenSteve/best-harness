<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="320" rx="14" fill="#0d1117"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#e8edf5">真实跑分示例 · JobBench（human_resources_specialists/task1）</text>
  <text x="40" y="72" font-size="12.5" fill="#7d8699">codex 0.144.6 × kimi k3 · k=1 并行模式 · 8 条加权 rubric · 盲选采纳优化配置</text>

  <!-- chart -->
  <g>
    <!-- gridlines 0/25/50/75/100 over plot x 70..470, y 110..270 (160px) -->
    <g font-size="11" fill="#5f6b85" text-anchor="end">
      <line x1="70" y1="270" x2="470" y2="270" stroke="#2c3547" stroke-width="1.4"/>
      <text x="62" y="274">0%</text>
      <line x1="70" y1="230" x2="470" y2="230" stroke="#2c3547" stroke-width="0.7"/>
      <text x="62" y="234">25%</text>
      <line x1="70" y1="190" x2="470" y2="190" stroke="#2c3547" stroke-width="0.7"/>
      <text x="62" y="194">50%</text>
      <line x1="70" y1="150" x2="470" y2="150" stroke="#2c3547" stroke-width="0.7"/>
      <text x="62" y="154">75%</text>
      <line x1="70" y1="110" x2="470" y2="110" stroke="#2c3547" stroke-width="0.7"/>
      <text x="62" y="114">100%</text>
    </g>
    <!-- base bar 68.8% -> height 110, y 270-110=160 -->
    <rect x="180" y="160" width="72" height="110" rx="6" fill="#9aa0a8"/>
    <text x="216" y="148" text-anchor="middle" font-size="15" font-weight="650" fill="#c3c9d4">68.8%</text>
    <text x="216" y="292" text-anchor="middle" font-size="12" fill="#7d8699">基线配置（base）</text>
    <!-- refined bar 90.6% -> height 145, y 125 -->
    <rect x="300" y="125" width="72" height="145" rx="6" fill="#3ecf72"/>
    <text x="336" y="113" text-anchor="middle" font-size="15" font-weight="650" fill="#3ecf72">90.6%</text>
    <text x="336" y="292" text-anchor="middle" font-size="12" fill="#7d8699">优化后（agg1）</text>
    <!-- delta arrow -->
    <path d="M 256 158 L 296 130" stroke="#3ecf72" stroke-width="2" stroke-dasharray="4 3"/>
    <circle cx="256" cy="158" r="3" fill="#3ecf72"/>
    <circle cx="296" cy="130" r="3" fill="#3ecf72"/>
  </g>

  <!-- right panel -->
  <g>
    <rect x="520" y="100" width="400" height="180" rx="12" fill="#151a26" stroke="#2c3547"/>
    <text x="560" y="168" font-size="52" font-weight="800" fill="#3ecf72">+21.9 <tspan font-size="24" font-weight="650">pts</tspan></text>
    <text x="560" y="200" font-size="13" fill="#c3c9d4">一轮 Propose–Probe–Compose 的提升</text>
    <text x="560" y="228" font-size="12" fill="#7d8699">44/64 → 58/64（rubric 加权分，全过才得分）</text>
    <text x="560" y="250" font-size="12" fill="#7d8699">评审：kimi k3 · 逐条 criterion 判定 · 选后打分</text>
  </g>
</svg>
